[package]
name = "devboard"
version = "0.1.0"
edition = "2021"
description = "AI-driven project management tool"
authors = []

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.28"
pulldown-cmark = "0.11"
